<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Building systems — Ryan Brosas social poster</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--color-charcoal);
      color: var(--text-1);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .poster-shell {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .poster {
      position: relative;
      width: var(--campaign-canvas-width);
      height: var(--campaign-canvas-height);
      overflow: hidden;
      transform-origin: top left;
      background: var(--campaign-canvas-bg);
      color: var(--campaign-canvas-fg);
      box-shadow: var(--shadow-overlay);
      isolation: isolate;
    }
    .coral-field {
      position: absolute;
      inset: 0 0 0 auto;
      width: var(--campaign-accent-width);
      background: var(--campaign-accent-bg);
      z-index: -3;
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }
    .grid-lines::before,
    .grid-lines::after {
      content: "";
      position: absolute;
      background: var(--campaign-rule);
    }
    .grid-lines::before {
      top: 0;
      bottom: 0;
      left: 79px;
      width: 1px;
    }
    .grid-lines::after {
      left: 80px;
      right: 80px;
      top: 153px;
      height: 1px;
    }
    .topline {
      position: absolute;
      top: 58px;
      left: 80px;
      right: 80px;
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-8);
    }
    .identity {
      display: grid;
      gap: var(--space-2);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: var(--tracking-label);
    }
    .identity strong {
      font-size: 18px;
      line-height: var(--leading-label);
    }
    .identity span {
      font-size: 13px;
      line-height: var(--leading-label);
      color: var(--campaign-meta);
    }
    .logo-tile {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--logo-tile-bg);
    }
    .logo-tile img {
      display: block;
      width: 52px;
      height: auto;
      transform: translateY(2px);
    }
    .headline {
      position: absolute;
      top: 205px;
      left: 80px;
      width: 910px;
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--campaign-title-size);
      line-height: var(--campaign-title-leading);
      font-weight: var(--weight-strong);
      letter-spacing: var(--tracking-display);
      text-wrap: balance;
      z-index: 2;
    }
    .headline .line {
      display: block;
      white-space: nowrap;
    }
    .headline .last {
      position: relative;
      display: inline-block;
    }
    .headline .last::after {
      content: "";
      position: absolute;
      left: 8px;
      right: -6px;
      bottom: -18px;
      height: 12px;
      background: var(--accent-decoration);
    }
    .hero-plate {
      position: absolute;
      left: 447px;
      top: 704px;
      width: 608px;
      height: 608px;
      display: grid;
      place-items: center;
      margin: 0;
      z-index: 1;
    }
    .hero-plate img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .system-note {
      position: absolute;
      left: 80px;
      bottom: 132px;
      width: 340px;
      padding-top: var(--space-4);
      border-top: var(--rule-strong);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 15px;
      line-height: 1.55;
      z-index: 2;
    }
    .system-note span { display: block; }
    .system-note .muted {
      margin-top: var(--space-3);
      color: var(--campaign-meta);
      text-transform: none;
      letter-spacing: 0;
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.45;
    }
    .footer {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-8);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: var(--leading-label);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      z-index: 3;
    }
    .footer .edition {
      color: var(--campaign-meta);
    }
    @media print {
      @page { size: 1080px 1350px; margin: 0; }
      html, body { width: 1080px; height: 1350px; overflow: visible; background: var(--presentation-light-bg); }
      .poster-shell { position: static; width: 1080px; height: 1350px; }
      .poster { transform: none !important; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="poster-shell" aria-label="Ryan Brosas campaign poster">
    <article class="poster" id="poster" data-od-id="building-systems-poster">
      <div class="coral-field" aria-hidden="true"></div>
      <div class="grid-lines" aria-hidden="true"></div>

      <header class="topline" data-od-id="poster-identity">
        <div class="identity">
          <strong>Ryan Brosas</strong>
          <span>Agent Systems Builder</span>
        </div>
        <div class="logo-tile" data-od-id="poster-logo-tile">
          <img src="logos/Logo---Ryan-1.svg" alt="Ryan Brosas R lightning symbol" />
        </div>
      </header>

      <h1 class="headline" data-od-id="poster-headline">
        <span class="line">Building systems</span>
        <span class="line">so everything</span>
        <span class="line">doesn’t need</span>
        <span class="line"><span class="last">you.</span></span>
      </h1>

      <figure class="hero-plate" data-od-id="poster-system-conductor">
        <img src="assets/illustrations/agent-operator-hero-system-conductor-clean-print.png" alt="Illustrated system conductor coordinating connected modules" />
      </figure>

      <aside class="system-note" data-od-id="poster-system-note">
        <span>Context / checks</span>
        <span>Handoffs / recovery</span>
        <span class="muted">Practical agent systems for work that keeps routing back to you.</span>
      </aside>

      <footer class="footer" data-od-id="poster-footer">
        <span>Systems before spectacle</span>
        <span class="edition">Social announcement / 4:5</span>
      </footer>
    </article>
  </main>
  <script>
    (function () {
      var poster = document.getElementById('poster');
      function fitPoster() {
        if (window.matchMedia('print').matches) return;
        var pad = 32;
        var scale = Math.min((window.innerWidth - pad) / 1080, (window.innerHeight - pad) / 1350);
        if (!isFinite(scale) || scale <= 0) scale = 1;
        var x = (window.innerWidth - 1080 * scale) / 2;
        var y = (window.innerHeight - 1350 * scale) / 2;
        poster.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + scale + ')';
      }
      window.addEventListener('resize', fitPoster);
      fitPoster();
    })();
  </script>
</body>
</html>
